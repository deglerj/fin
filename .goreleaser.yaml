version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: fin-unix
    main: ./cmd/fin
    binary: fin
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
  - id: fin-windows
    main: ./cmd/fin
    binary: fin
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: fin-unix
    ids: [fin-unix]
    name_template: "fin_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - src: man/fin.1
        dst: share/man/man1
  - id: fin-windows
    ids: [fin-windows]
    name_template: "fin_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
